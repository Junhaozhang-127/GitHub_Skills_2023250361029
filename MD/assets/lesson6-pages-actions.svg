<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <rect width="900" height="300" fill="#f6f8fa"/>
  <style>
    .title{font:700 22px "Microsoft YaHei",Arial,sans-serif;fill:#1f2328}
    .txt{font:16px "Microsoft YaHei",Arial,sans-serif;fill:#24292f}
    .card{fill:#fff;stroke:#0969da;stroke-width:2;rx:10}
    .arrow{stroke:#57606a;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>
  <text x="32" y="42" class="title">第 6 节：Pages 展示与 Actions 自动化</text>
  <rect x="60" y="92" width="190" height="105" class="card"/>
  <text x="95" y="132" class="txt">Markdown 文档</text>
  <text x="95" y="164" class="txt">课程报告内容</text>
  <line x1="260" y1="145" x2="355" y2="145" class="arrow"/>
  <rect x="365" y="72" width="190" height="70" class="card"/>
  <text x="406" y="116" class="txt">Pages 在线展示</text>
  <rect x="365" y="168" width="190" height="70" class="card"/>
  <text x="394" y="212" class="txt">Actions 自动检查</text>
  <line x1="565" y1="107" x2="650" y2="145" class="arrow"/>
  <line x1="565" y1="203" x2="650" y2="165" class="arrow"/>
  <rect x="660" y="92" width="190" height="105" class="card"/>
  <text x="704" y="132" class="txt">提交质量提升</text>
  <text x="704" y="164" class="txt">展示方式扩展</text>
</svg>
